name: Qingjian Android

on:
  push:
    branches:
      - feature/qingjian-studio
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qingjian-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    name: Build Qingjian Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: 配置构建环境
        uses: ./.github/actions/setup-build

      - name: 编译 Debug APK
        run: >-
          ./gradlew --no-daemon --no-configuration-cache
          "-Peta.buildMetadata=${GITHUB_SHA::7}"
          :app:assembleDebug

      - name: 核对 APK 安装包名
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/Eta-v*.apk)
          [[ ${#apks[@]} -eq 1 ]]
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          "$aapt" dump badging "${apks[0]}" | grep -F "package: name='io.wboat.eta'"

      - name: 上传 Debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Qingjian-Android-Debug
          path: app/build/outputs/apk/debug/Eta-v*.apk
          if-no-files-found: error
          retention-days: 14

      - name: 运行单元测试
        run: >-
          ./gradlew --no-daemon --no-configuration-cache
          "-Peta.buildMetadata=${GITHUB_SHA::7}"
          :app:testDebugUnitTest

      - name: 上传失败测试报告
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Qingjian-Test-Reports
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
